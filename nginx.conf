map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream fmt_frontend {
    server host.docker.internal:8080;
}

upstream fmt_backend {
    server host.docker.internal:8081;
}

upstream fmt_grafana {
    server host.docker.internal:3000;
}

server {
    listen 80;
    listen [::]:80;
    server_name conv.soltanov.dev grafana.conv.soltanov.dev;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name conv.soltanov.dev;

    ssl_certificate /etc/letsencrypt/live/conv.soltanov.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/conv.soltanov.dev/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;

    location /api/ {
        client_max_body_size 8k;
        proxy_pass http://fmt_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        client_max_body_size 1m;
        proxy_pass http://fmt_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name grafana.conv.soltanov.dev;

    ssl_certificate /etc/letsencrypt/live/grafana.conv.soltanov.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/grafana.conv.soltanov.dev/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://fmt_grafana;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
