services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: so1-formatter-converter-backend:latest
    container_name: so1-formatter-converter-backend
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8081}:8081"
    environment:
      PORT: "8081"
      BACKEND_DB: /data/backend.sqlite
      BACKEND_RETENTION_DAYS: ${BACKEND_RETENTION_DAYS:-30}
      BACKEND_TOKEN: ${BACKEND_TOKEN:-}
      GEOIP_DIR: /data
    volumes:
      - backend-data:/data
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:mode=1777
    security_opt:
      - no-new-privileges:true

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        YANDEX_METRIKA_ENABLED: ${YANDEX_METRIKA_ENABLED:-false}
    image: so1-formatter-converter-frontend:latest
    container_name: so1-formatter-converter-frontend
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:80"
    depends_on:
      - backend
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /var/cache/nginx:mode=1777
      - /var/log/nginx:mode=1777
      - /var/run:mode=1777
      - /run:mode=1777
      - /tmp:mode=1777
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: so1-formatter-converter-prometheus
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - backend
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.5.2
    container_name: so1-formatter-converter-grafana
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-APpeQnvIi0SnKF6}
      GF_SECURITY_COOKIE_SECURE: "true"
      GF_SERVER_DOMAIN: grafana.soltanov.dev
      GF_SERVER_ROOT_URL: https://grafana.soltanov.dev
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_UID: fmt-site
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/etc/grafana/dashboards:ro
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  backend-data:
