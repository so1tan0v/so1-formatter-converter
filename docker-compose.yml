services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: so1-formatter-converter-frontend:latest
    container_name: so1-formatter-converter-frontend
    ports:
      - "${APP_PORT:-80}:80"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /var/cache/nginx:mode=1777
      - /var/log/nginx:mode=1777
      - /var/run:mode=1777
      - /run:mode=1777
      - /tmp:mode=1777
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
