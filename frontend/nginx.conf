server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok";
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Content-Security-Policy "frame-ancestors 'self' https://alex.soltanov.dev https://*.soltanov.dev" always;
        try_files $uri $uri/ /index.html;
    }
}
